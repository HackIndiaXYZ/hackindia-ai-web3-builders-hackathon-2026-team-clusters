<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>EchoMesh — Emergency SOS Panic Beacon</title>
  <style>
    :root {
      --bg: #06080e;
      --surface: #0f1524;
      --red: #dc2626;
      --red-bright: #ef4444;
      --red-dark: #991b1b;
      --red-glow: rgba(239, 68, 68, 0.45);
      --green: #22c55e;
      --green-glow: rgba(34, 197, 94, 0.35);
      --cyan: #06b6d4;
      --yellow: #eab308;
      --white: #f8fafc;
      --dim: #64748b;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --mono: 'Consolas', 'Courier New', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: var(--font);
      color: var(--white);
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* Animated background hazard grid */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(239, 68, 68, 0.1) 1px, transparent 0);
      background-size: 32px 32px;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      padding: 24px 20px;
    }

    /* ── Top badge ── */
    .badge-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 480px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--white);
      font-weight: 600;
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid rgba(220, 38, 38, 0.35);
      padding: 6px 14px;
      border-radius: 100px;
    }
    .badge .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--red-bright);
      animation: dotPulse 1.2s ease-in-out infinite;
    }

    .user-pill {
      font-size: 11px;
      color: var(--dim);
      font-family: var(--mono);
      cursor: pointer;
    }
    .user-pill:hover { color: var(--cyan); text-decoration: underline; }

    /* ── SOS Button Area ── */
    .sos-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      width: 100%;
    }

    .sos-btn-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sos-ring {
      position: absolute;
      width: 290px; height: 290px;
      border-radius: 50%;
      border: 2px solid rgba(239, 68, 68, 0.25);
      animation: ringPulse 2.5s ease-in-out infinite;
      pointer-events: none;
    }
    .sos-ring:nth-child(2) {
      width: 350px; height: 350px;
      animation-delay: 0.6s;
      border-color: rgba(239, 68, 68, 0.12);
    }
    .sos-ring:nth-child(3) {
      width: 410px; height: 410px;
      animation-delay: 1.2s;
      border-color: rgba(239, 68, 68, 0.05);
    }

    .sos-btn {
      width: 230px;
      height: 230px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.2);
      background: radial-gradient(circle at 35% 30%, #ef4444 0%, #b91c1c 65%, #7f1d1d 100%);
      color: white;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.06em;
      cursor: pointer;
      position: relative;
      z-index: 2;
      box-shadow:
        0 0 50px var(--red-glow),
        0 0 100px rgba(220, 38, 38, 0.2),
        inset 0 -6px 16px rgba(0,0,0,0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      user-select: none;
      -webkit-user-select: none;
    }

    .sos-btn:active {
      transform: scale(0.93);
      box-shadow: 0 0 25px var(--red-glow);
    }

    .sos-btn .icon {
      font-size: 46px;
      line-height: 1;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
    }

    .sos-btn .label {
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .sos-btn.sent {
      background: radial-gradient(circle at 35% 30%, #22c55e 0%, #15803d 70%, #14532d 100%);
      border-color: rgba(255,255,255,0.4);
      box-shadow: 0 0 60px var(--green-glow);
    }

    /* ── Alarm Sound Control Bar ── */
    .siren-control {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(220, 38, 38, 0.12);
      border: 1px solid rgba(220, 38, 38, 0.3);
      padding: 8px 16px;
      border-radius: 100px;
      font-size: 12px;
      font-family: var(--mono);
      color: #fca5a5;
    }

    .siren-btn {
      background: #dc2626;
      border: none;
      color: white;
      padding: 4px 12px;
      border-radius: 100px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      letter-spacing: 0.05em;
    }
    .siren-btn:active { transform: scale(0.95); }

    /* ── Status area ── */
    .status {
      text-align: center;
      min-height: 70px;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 16px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .status-text {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .status-text.sending { color: var(--yellow); }
    .status-text.success { color: var(--green); }
    .status-text.error { color: var(--red-bright); }
    .status-text.locating { color: var(--cyan); }

    .status-sub {
      font-size: 11px;
      color: var(--dim);
      font-family: var(--mono);
    }

    /* ── Name prompt overlay ── */
    .name-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
    }

    .name-card {
      background: var(--surface);
      border: 1px solid #1e293b;
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 50px rgba(0,0,0,0.8);
    }

    .name-card h2 {
      font-size: 20px;
      margin-bottom: 8px;
      font-weight: 800;
      color: var(--white);
    }

    .name-card p {
      font-size: 13px;
      color: var(--dim);
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .name-card input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid #334155;
      background: #090d16;
      color: var(--white);
      font-size: 16px;
      text-align: center;
      outline: none;
      margin-bottom: 18px;
    }
    .name-card input:focus {
      border-color: var(--red-bright);
    }

    .name-card button {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 0.05em;
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.4);
    }

    /* ── Footer ── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 480px;
      font-size: 11px;
      color: var(--dim);
      font-family: var(--mono);
    }
    .footer a {
      color: var(--cyan);
      text-decoration: none;
    }
    .footer a:hover { text-decoration: underline; }

    /* ── Animations ── */
    @keyframes dotPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.3); }
    }

    @keyframes ringPulse {
      0% { transform: scale(0.95); opacity: 0.6; }
      50% { transform: scale(1.12); opacity: 0.15; }
      100% { transform: scale(0.95); opacity: 0.6; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      display: inline-block;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>

  <!-- Name Prompt Overlay -->
  <div class="name-overlay" id="nameOverlay" style="display:none;">
    <div class="name-card">
      <h2>🚨 EchoMesh SOS</h2>
      <p>Enter your name or identity so rescue teams can recognize your signal</p>
      <input type="text" id="nameInput" placeholder="e.g. Rahul Sharma" autocomplete="off" autofocus>
      <button onclick="saveName()">Activate Beacon</button>
    </div>
  </div>

  <div class="container">
    <!-- Top Bar -->
    <div class="badge-bar">
      <div class="badge">
        <span class="dot"></span>
        <span>EMERGENCY BEACON</span>
      </div>
      <span class="user-pill" id="userPill" onclick="promptName()">👤 Set Name</span>
    </div>

    <!-- Main Panic Button -->
    <div class="sos-area">
      <div class="sos-btn-wrapper">
        <div class="sos-ring"></div>
        <div class="sos-ring"></div>
        <div class="sos-ring"></div>
        <button class="sos-btn" id="sosBtn" onclick="triggerSOS()">
          <span class="icon">🆘</span>
          <span class="label">PRESS FOR HELP</span>
        </button>
      </div>

      <!-- Siren Active Bar (Shown when sounding) -->
      <div class="siren-control" id="sirenControl" style="display:none;">
        <span>🔊 Emergency Siren Active</span>
        <button class="siren-btn" onclick="toggleSiren()">MUTE</button>
      </div>

      <!-- Status Card -->
      <div class="status" id="statusArea">
        <span class="status-text" style="color: var(--dim);">Tap the button to broadcast emergency signal & sound siren</span>
      </div>
    </div>

    <!-- Footer Links -->
    <div class="footer">
      <span>Offline Mesh · No Internet</span>
      <a href="rescue-dashboard.html" target="_blank">Rescue Dashboard ↗</a>
    </div>
  </div>

<script>
// ══════════════════════════════════════════════════════════════
//  DYNAMIC ROUTER URL (Works automatically on port 4000 / 5173 / Mobile)
// ══════════════════════════════════════════════════════════════
const ROUTER_URL = window.location.port === '4000'
  ? '' 
  : window.location.protocol + '//' + window.location.hostname + ':4000';

const btn = document.getElementById('sosBtn');
const statusArea = document.getElementById('statusArea');
const sirenControl = document.getElementById('sirenControl');
let isSending = false;
let retryTimer = null;

// ══════════════════════════════════════════════════════════════
//  OFFLINE WEB AUDIO API EMERGENCY SIREN SYNTHESIZER
// ══════════════════════════════════════════════════════════════
let audioCtx = null;
let sirenInterval = null;
let isSirenPlaying = false;

function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playWarningTone(freq = 900, duration = 0.2) {
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function startEmergencySiren() {
  initAudio();
  if (isSirenPlaying) return;
  isSirenPlaying = true;
  sirenControl.style.display = 'flex';

  // Initial loud alert bursts
  playWarningTone(1000, 0.25);
  setTimeout(() => playWarningTone(1200, 0.25), 150);

  let highTone = true;
  sirenInterval = setInterval(() => {
    if (!isSirenPlaying) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    const target = highTone ? 980 : 640;
    const duration = 0.55;

    osc.frequency.setValueAtTime(highTone ? 640 : 980, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(target, audioCtx.currentTime + duration);

    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.35, audioCtx.currentTime + duration - 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);

    highTone = !highTone;
  }, 580);
}

function stopEmergencySiren() {
  isSirenPlaying = false;
  if (sirenInterval) {
    clearInterval(sirenInterval);
    sirenInterval = null;
  }
  sirenControl.style.display = 'none';
}

function toggleSiren() {
  if (isSirenPlaying) stopEmergencySiren();
  else startEmergencySiren();
}

// ══════════════════════════════════════════════════════════════
//  NAME & LOCAL STORAGE
// ══════════════════════════════════════════════════════════════
function checkName() {
  const name = localStorage.getItem('echomesh_sos_name');
  if (name) {
    document.getElementById('userPill').textContent = '👤 ' + name;
  } else {
    document.getElementById('nameOverlay').style.display = 'flex';
    document.getElementById('nameInput').focus();
  }
}

function promptName() {
  document.getElementById('nameOverlay').style.display = 'flex';
  document.getElementById('nameInput').value = localStorage.getItem('echomesh_sos_name') || '';
  document.getElementById('nameInput').focus();
}

function saveName() {
  const input = document.getElementById('nameInput');
  const name = input.value.trim();
  if (!name) { input.style.borderColor = '#ef4444'; return; }
  localStorage.setItem('echomesh_sos_name', name);
  document.getElementById('userPill').textContent = '👤 ' + name;
  document.getElementById('nameOverlay').style.display = 'none';
}

document.getElementById('nameInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') saveName();
});

// ══════════════════════════════════════════════════════════════
//  SOS TRIGGER FLOW
// ══════════════════════════════════════════════════════════════
async function triggerSOS() {
  if (isSending) return;
  isSending = true;

  // 1. Immediately sound Emergency Siren Alarm!
  startEmergencySiren();

  const deviceName = localStorage.getItem('echomesh_sos_name') || 'Unknown Victim';
  if (retryTimer) { clearInterval(retryTimer); retryTimer = null; }

  // 2. Locate
  setStatus('locating', '<span class="spinner"></span> Acquiring GPS coordinates...');

  let latitude = null;
  let longitude = null;

  try {
    const pos = await getLocation(6000);
    latitude = pos.coords.latitude;
    longitude = pos.coords.longitude;
  } catch (e) {
    // Continue without GPS if denied
  }

  // 3. Broadcast
  setStatus('sending', '<span class="spinner"></span> Broadcasting to local mesh...');
  await sendSOS(deviceName, latitude, longitude);
}

function getLocation(timeout) {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject('no geolocation');
    navigator.geolocation.getCurrentPosition(resolve, reject, {
      enableHighAccuracy: true,
      timeout: timeout,
      maximumAge: 0
    });
  });
}

async function sendSOS(deviceName, latitude, longitude) {
  try {
    const endpoint = `${ROUTER_URL}/sos`;
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        deviceName,
        latitude,
        longitude,
        message: '🚨 Emergency! Need immediate rescue assistance!'
      })
    });

    if (res.status === 429) {
      const data = await res.json();
      setStatus('sending', `⏳ Cooldown: Please wait ${data.retryAfterSeconds}s before sending again`);
      isSending = false;
      return;
    }

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    setStatus('success', `✅ Signal Broadcasted! ${data.devicesNotified} mesh device${data.devicesNotified !== 1 ? 's' : ''} notified.`);
    if (latitude && longitude) {
      statusArea.innerHTML += `<span class="status-sub">📍 Coordinates: ${latitude.toFixed(4)}, ${longitude.toFixed(4)}</span>`;
    }
    btn.classList.add('sent');
    btn.innerHTML = '<span class="icon">✅</span><span class="label">HELP IS ON THE WAY</span>';
    isSending = false;

    // Reset button after 30s
    setTimeout(() => {
      btn.classList.remove('sent');
      btn.innerHTML = '<span class="icon">🆘</span><span class="label">PRESS FOR HELP</span>';
      setStatus('default', 'Tap the button to broadcast emergency signal & sound siren');
    }, 30000);

  } catch (e) {
    setStatus('error', '❌ Could not reach mesh router — retrying every 5s...');
    isSending = false;

    retryTimer = setInterval(async () => {
      setStatus('sending', '<span class="spinner"></span> Retrying emergency broadcast...');
      await sendSOS(deviceName, latitude, longitude);
      if (retryTimer && statusArea.querySelector('.success')) {
        clearInterval(retryTimer);
        retryTimer = null;
      }
    }, 5000);
  }
}

function setStatus(type, html) {
  statusArea.innerHTML = `<span class="status-text ${type}">${html}</span>`;
}

checkName();
</script>
</body>
</html>
